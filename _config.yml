# GitHub Pages auto-builds this site with Jekyll using the minimal remote theme.
remote_theme: pages-themes/minimal@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

title: The Fermi Paradox in Artificial Life
description: A project exploring the connections between Artificial Life (ALife) and the Search for Extraterrestrial Intelligence (SETI).

# Hide the theme's "Download .zip / .tar.gz" buttons in the sidebar.
show_downloads: false

# Files that should not be copied into the built site.
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
